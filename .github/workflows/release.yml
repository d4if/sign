name: Auto Tag & Multi-Platform Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --all-targets

  tag:
    name: Auto Tag Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and push next SemVer tag
        id: create_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          EXISTING_HEAD_TAG=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)
          if [ -n "$EXISTING_HEAD_TAG" ]; then
            echo "HEAD already tagged as $EXISTING_HEAD_TAG"
            echo "tag=$EXISTING_HEAD_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v${CARGO_VER}"
          else
            CLEAN_LATEST="${LATEST_TAG#v}"
            HIGHEST=$(printf '%s\n%s\n' "$CARGO_VER" "$CLEAN_LATEST" | sort -V | tail -n1)
            if [ "$HIGHEST" = "$CARGO_VER" ] && [ "$CARGO_VER" != "$CLEAN_LATEST" ]; then
              NEXT_TAG="v${CARGO_VER}"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_LATEST"
              PATCH="${PATCH%%-*}"
              NEXT_PATCH=$((PATCH + 1))
              NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi

          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"
          echo "Created and pushed tag $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: sign
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: sign
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin: sign
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: sign.exe
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            bin: sign.exe
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: sign
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: sign
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux cross/musl toolchains
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGE="sign-${{ needs.tag.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          rm -rf "$STAGE"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "sign-${{ needs.tag.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$stage/"
          Copy-Item "README.md", "LICENSE" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "${stage}.zip" -Force
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            sign-*.tar.gz
            sign-*.zip

  release:
    name: Publish GitHub Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum sign-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: "sign ${{ needs.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            release-assets/sign-*.tar.gz
            release-assets/sign-*.zip
            release-assets/SHA256SUMS.txt
