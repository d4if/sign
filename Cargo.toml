[package]
name = "d4if-sign"
version = "0.1.0"
edition = "2021"
authors = ["D4 Teknik Informatika ULBI"]
description = "Generator tanda tangan digital dokumen berbasis QR Code menggunakan PASETO v4.public"
license = "MIT"
repository = "https://github.com/d4if/sign"

[[bin]]
name = "sign"
path = "src/main.rs"

[lib]
name = "d4if_sign"
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui-file-dialog", "dep:hayro"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
eframe = { version = "0.37", optional = true }
egui-file-dialog = { version = "0.16", optional = true }
hayro = { version = "0.9", optional = true }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = "0.47"
pasetors = "0.8.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg", "image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
